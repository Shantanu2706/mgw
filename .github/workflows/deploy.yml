name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Build JAR
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests

    -  name: Login to Docker Hub
       uses: docker/login-action@v4
       with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: docker build -t ${{secrets.DOCKERHUB_USERNAME }}/mgw:latest .

    - name: Push Image to Docker Hub
      run: docker push ${{secrets.DOCKERHUB_USERNAME }}/mgw:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{secrets.EC2_HOST}}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop mgw || true
          docker rm mgw || true
          docker pull ${{secrets.DOCKERHUB_USERNAME }}/mgw:latest
          docker run -d --name mgw -p 8080:8080 ${{secrets.DOCKERHUB_USERNAME }}/mgw:latest
